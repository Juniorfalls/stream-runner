name: Auto-Deploy Stream Runner

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest game code
        uses: actions/checkout@v4

      # 1. Package clean ZIP for CrazyGames & YouTube Playables
      - name: Build release ZIP bundle
        run: zip -r stream-runner-build.zip index.html

      # 2. Install official itch.io Butler CLI & push directly to itch.io
      - name: Push build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler push stream-runner-build.zip tarikoboh/stream-runner:html5

      # 3. Attach ZIP to GitHub Releases for 1-click CrazyGames/YouTube upload
      - name: Publish GitHub Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: stream-runner-build.zip
